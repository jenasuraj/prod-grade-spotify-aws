services:
  postgres:
    image: postgres:17-alpine
    container_name: spotify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spotify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spotify}
      POSTGRES_DB: ${POSTGRES_DB:-spotify}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-spotify}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: spotify-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    # 6380 on the host so it doesn't clash with other projects' Redis on 6379
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
